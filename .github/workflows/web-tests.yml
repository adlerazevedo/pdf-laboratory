name: web-tests

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shared/**"
      - ".github/workflows/web-tests.yml"
  pull_request:
    paths:
      - "web/**"
      - "shared/**"
      - ".github/workflows/web-tests.yml"

permissions:
  contents: read

jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Gerar fixtures sintéticas de teste
        working-directory: web
        run: npm run fixtures:generate

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Checagem de tipos
        working-directory: web
        run: npm run typecheck

      - name: Testes unitários (Vitest)
        working-directory: web
        run: npm run test

      - name: Auditoria de dependências
        working-directory: web
        run: npm audit --audit-level=high || true

  e2e:
    runs-on: ubuntu-latest
    needs: unit-and-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build de produção
        working-directory: web
        run: npm run build
        env:
          CI: "true"

      - name: Instalar navegadores do Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Testes end-to-end (Playwright + axe-core)
        working-directory: web
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
