name: release-desktop

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências Python
        working-directory: desktop
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pypdf pypdfium2 Pillow pydantic platformdirs psutil pyinstaller

      - name: Verificar sintaxe (py_compile)
        working-directory: desktop
        run: python -m py_compile PDF_Laboratory.py

      - name: Empacotar com PyInstaller (onefile)
        working-directory: desktop
        run: pyinstaller --onefile --windowed --name PDF_Laboratory PDF_Laboratory.py

      - name: Calcular SHA-256 do executável (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop/dist
        run: sha256sum PDF_Laboratory > PDF_Laboratory.sha256

      - name: Calcular SHA-256 do executável (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop/dist
        run: certutil -hashfile PDF_Laboratory.exe SHA256 > PDF_Laboratory.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-laboratory-desktop-${{ runner.os }}
          path: |
            desktop/dist/PDF_Laboratory*
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publicar release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/PDF_Laboratory*
          generate_release_notes: true
